name: Linux integration Demo
on:
  push:
    paths: ['platforms/Linux/**', '.github/workflows/linux-demo.yml']
  pull_request:
    paths: ['platforms/Linux/**', '.github/workflows/linux-demo.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, arch: x86_64}
          - {runner: ubuntu-24.04, arch: x86_64}
          - {runner: ubuntu-22.04-arm, arch: arm64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: platforms/Linux
    steps:
      - uses: actions/checkout@v4
      - name: Install integration build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libx11-6 xvfb xauth
      - name: Verify and execute prebuilt binary SDK
        run: |
          SDK="$PWD/runtimes/${{ matrix.arch }}/sdk"
          (cd "$SDK" && sha256sum -c FILES.sha256)
          ./self-test.sh
          cmake -S examples/image-search -B build/consumer -DCMAKE_PREFIX_PATH="$SDK"
          cmake --build build/consumer --parallel 2
          ./build/consumer/hiface_sdk_image_search --builtin :memory: --blank 256 256
      - name: Rebuild Demo using binary SDK only
        run: |
          cmake -S . -B build/demo -DCMAKE_BUILD_TYPE=Release
          cmake --build build/demo --parallel 2
          ./build/demo/hiface_demo self-test --builtin
      - name: Exercise prebuilt and rebuilt desktop with synthetic frames
        run: |
          SDK="$PWD/runtimes/${{ matrix.arch }}/sdk"
          xvfb-run -a -s '-screen 0 1024x768x24' "./runtimes/${{ matrix.arch }}/bin/hiface_desktop" --builtin "$RUNNER_TEMP/prebuilt/faces.db" --smoke-test
          xvfb-run -a -s '-screen 0 1024x768x24' ./build/demo/hiface_desktop --builtin "$RUNNER_TEMP/rebuilt/faces.db" --smoke-test
